name: 当せん番号の自動更新

on:
  schedule:
    - cron: '10 23 * * 1,4'
    - cron: '10 23 * * 2,5'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: update-loto
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # 何が置かれているかを最初に出しておく（失敗時の切り分け用）
      - name: リポジトリの中身を確認
        run: |
          echo "--- ルート ---"
          ls -la
          echo "--- tools/ ---"
          ls -la tools 2>/dev/null || echo "(tools/ がありません)"
          echo "--- data/ ---"
          ls -la data 2>/dev/null || echo "(data/ がありません)"
          if [ ! -f tools/update-loto.mjs ]; then
            echo "::error::tools/update-loto.mjs がリポジトリにありません。"
            exit 1
          fi

      # まずは追加インストールなしで取得を試す
      - name: 当せん番号を取得
        id: fetch
        continue-on-error: true
        run: node tools/update-loto.mjs

      # 上が失敗したときだけ、実ブラウザを入れて再試行する
      - name: 失敗したら Playwright で再試行
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "通常の取得に失敗したため、ブラウザ経由で再試行します"
          npm init -y >/dev/null 2>&1 || true
          npm i -D playwright@latest
          npx playwright install --with-deps chromium
          node tools/update-loto.mjs

      - name: 変更があればコミット
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "変更なし。コミットしません。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore(data): 当せん番号を更新 $(date -u +%Y-%m-%d)"
          git push
